<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login do Funcionário</title>

    <link rel="stylesheet" href="login.css">

</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <h1>Área do Funcionário</h1>

            <p>
                Entre para visualizar os chamados de resgate.
            </p>


            <div id="erro"></div>


            <form action="login.php" method="POST">

                <input
                    type="text"
                    name="usuario"
                    placeholder="Usuário"
                    required
                >

                <input
                    type="password"
                    name="senha"
                    placeholder="Senha"
                    required
                >

                <button type="submit">
                    Entrar
                </button>

            </form>


            <a href="index.html">
                Voltar para o site
            </a>

        </div>

    </main>


    <script src="login.js"></script>

</body>

</html>
